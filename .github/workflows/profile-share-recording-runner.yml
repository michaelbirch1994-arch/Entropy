name: Profile share recording runner

on:
  push:
    branches:
      - feature/profile-record-share-links

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/profile-record-share-links
          fetch-depth: 0
      - name: Apply edit
        run: python scripts/apply-profile-share-recording.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-profile-share-recording.py .github/workflows/profile-share-recording-runner.yml
          git add src/store/ReportContext.tsx
          git diff --cached --check
          git commit -m "Record shared reports into Player Profiles"
          git push origin HEAD:feature/profile-record-share-links
