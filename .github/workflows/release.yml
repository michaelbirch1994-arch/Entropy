name: Release desktop builds

# Builds Entropy as a native Tauri app for Windows, macOS, and Linux, and
# attaches the installers to a GitHub Release. Triggered by pushing a tag
# like "v0.1.0" - GitHub's own runners have Rust preinstalled, so this is
# how installers get built without anyone needing a local Rust toolchain.
#
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD (below) are
# what let the auto-updater work: every build gets signed with the app's
# private key, and the desktop app verifies that signature against the
# public key baked into tauri.conf.json before installing an update. These
# must be added as repo secrets (Settings > Secrets and variables > Actions)
# - see .github/workflows/generate-signing-key.yml for how the keypair was
# generated. Builds still succeed without them, they just won't produce
# signed updater artifacts (the updater feature silently has nothing to
# find), so this isn't a hard requirement, just a silent feature gap.
#
# Beyond updater signing, this workflow also attaches two extra layers of
# protection for anyone downloading a release directly (not through the
# updater): a GitHub build provenance attestation per installer (proves a
# given binary was built by *this* repo's CI from a specific commit, not
# tampered with or substituted after the fact - verifiable with
# `gh attestation verify`), and a SHA-256 checksums file per platform, for
# anyone who wants to verify their download without trusting the updater
# flow or GitHub's TLS alone. Both steps are non-blocking (continue-on-error)
# so a hiccup in either one can never take down the actual installer upload,
# which is the part that has to keep working.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    # GitHub's default GITHUB_TOKEN permissions for a repo are read-only
    # unless a workflow explicitly asks for more - without this, tauri-action
    # can build the installer fine but fails at the last step ("Resource not
    # accessible by integration") because it can't create/attach to a
    # GitHub Release, which needs contents: write. attestations: write and
    # id-token: write are what let actions/attest-build-provenance sign a
    # provenance statement for each installer.
    permissions:
      contents: write
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            name: "macos-arm64"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            name: "macos-x64"
          - platform: "ubuntu-22.04"
            args: ""
            name: "linux-x64"
          - platform: "windows-latest"
            args: ""
            name: "windows-x64"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        # npm install, not ci - package-lock.json wasn't regenerated when the
        # Tauri deps were added to package.json in this dev environment (no
        # npm registry access here to run a real `npm install`), same reason
        # ci.yml uses install instead of ci.
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Entropy ${{ github.ref_name }}"
          releaseBody: "See the changelog for details. Download the installer for your OS below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Attest build provenance
        # Cryptographically ties each installer back to this exact commit
        # and Actions run, so anyone who downloads a release can confirm it
        # was actually built by this repo's CI and not substituted or
        # tampered with after the fact. continue-on-error because this is a
        # transparency nice-to-have, not something that should ever block a
        # release from going out if the glob below misses on some platform.
        uses: actions/attest-build-provenance@v1
        continue-on-error: true
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.tar.gz

      - name: Publish SHA-256 checksums
        # A plain integrity check anyone can run by hand (sha256sum) without
        # needing to trust the updater signature flow or GitHub's TLS. Also
        # continue-on-error for the same reason as the attestation step above.
        continue-on-error: true
        shell: bash
        run: |
          set -eu
          out="checksums-${{ matrix.name }}.txt"
          : > "$out"
          find src-tauri/target -type f \( \
              -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o \
              -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o \
              -name '*.tar.gz' \) -path '*/release/bundle/*' -print0 \
            | xargs -0 sha256sum >> "$out" || true
          if [ -s "$out" ]; then
            gh release upload "${{ github.ref_name }}" "$out" --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # tauri-action uploads installers into a DRAFT release, one job per platform.
  # Publishing that draft by hand is easy to get wrong: opening the tag's release
  # page creates a SECOND, empty release on the same tag, and the real one with
  # the installers stays hidden as a draft. v0.2.1 shipped that way - published,
  # zero downloads. This job flips the draft that already holds the assets, only
  # after all four builds succeed, so there is nothing to publish manually and no
  # window where users can see a half-uploaded release.
  publish:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"
