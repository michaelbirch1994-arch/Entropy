name: Release desktop builds

# Builds Entropy as a native Tauri app for Windows, macOS, and Linux, and
# attaches the installers to a GitHub Release. Triggered by pushing a tag
# like "v0.1.0" - GitHub's own runners have Rust preinstalled, so this is
# how installers get built without anyone needing a local Rust toolchain.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "windows-latest"
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        # npm install, not ci - package-lock.json wasn't regenerated when the
        # Tauri deps were added to package.json in this dev environment (no
        # npm registry access here to run a real `npm install`), same reason
        # ci.yml uses install instead of ci.
        run: npm install

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Entropy ${{ github.ref_name }}"
          releaseBody: "See the changelog for details. Download the installer for your OS below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
