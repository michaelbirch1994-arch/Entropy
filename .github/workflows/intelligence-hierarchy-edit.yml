name: Intelligence hierarchy one-shot edit

on:
  push:
    branches:
      - feature/intelligence-hierarchy

permissions:
  contents: write

jobs:
  reorder:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/intelligence-hierarchy
          fetch-depth: 0

      - name: Reorder Intelligence presentation blocks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/views/IntelligenceDebugView.tsx')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)

          markers = {
              'episodes': '      <section className="theme-intelligence-dossier border border-violet-400/15 bg-black/35 p-5">',
              'heartbeat': '      <section className="theme-intelligence-heartbeat grid gap-4 xl:grid-cols-[1.15fr_0.85fr]">',
              'kpi': '      <section className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">',
              'filters': '      <section className="rounded-[2rem] border border-white/[0.06] bg-black/35 p-5"><div className="flex flex-wrap items-start justify-between gap-4"><div><div className="text-[11px] font-black uppercase tracking-[0.28em] text-slate-500">Analysis controls</div>',
              'narrative': '      {selectedFight && <FightNarrativePanel',
              'command': '      <section className="theme-intelligence-command-grid grid gap-4 xl:grid-cols-[1.45fr_0.55fr]">',
              'actions': '      <section className="grid gap-4 xl:grid-cols-[0.9fr_1.1fr]">',
              'deep': '      <section className="theme-evidence-gate border border-white/[0.07] bg-black/35 p-5">',
          }

          found = {}
          for name, marker in markers.items():
              matches = [i for i, line in enumerate(lines) if line.startswith(marker)]
              if len(matches) != 1:
                  raise SystemExit(f'{name}: expected exactly one marker, found {len(matches)}')
              found[name] = matches[0]

          expected = ['episodes', 'heartbeat', 'kpi', 'filters', 'narrative', 'command', 'actions', 'deep']
          positions = [found[name] for name in expected]
          if positions != sorted(positions):
              raise SystemExit(f'Unexpected current block order: {dict((n, found[n]) for n in expected)}')

          a, b, c, d, e, f, g, h = positions
          prefix = lines[:a]
          episodes = lines[a:b]
          heartbeat = lines[b:c]
          kpi = lines[c:d]
          filters = lines[d:e]
          narrative = lines[e:f]
          command = lines[f:g]
          actions = lines[g:h]
          suffix = lines[h:]

          # Intelligence product first, forensic tooling second.
          reordered = prefix + kpi + narrative + actions + heartbeat + command + episodes + filters + suffix
          path.write_text(''.join(reordered), encoding='utf-8')
          PY

      - name: Commit reordered view and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/intelligence-hierarchy-edit.yml
          git add src/views/IntelligenceDebugView.tsx
          git diff --cached --check
          git commit -m "Reorder Intelligence around conclusions first"
          git push origin HEAD:feature/intelligence-hierarchy
