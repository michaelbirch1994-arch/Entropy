name: Generate updater signing key

# One-off workflow that generates the Ed25519 keypair Tauri's updater uses
# to sign and verify releases. Deliberately not wired to any push/tag
# trigger - only runs when manually triggered from the Actions tab, since
# running it again generates a *different* key and would invalidate updates
# for anyone who already has the old public key baked into their app.
#
# The private key is encrypted with a randomly generated password (never
# printed to logs, never committed to the repo). Both the encrypted key and
# its password are uploaded as private, authenticated-download build
# artifacts. Only the public key (safe to share) is printed to this run's
# summary. After running this:
#   1. Download the "signing-key" and "signing-key-password" artifacts from
#      this run's Summary page.
#   2. Open entropy-signing.key in a text editor, copy the contents.
#   3. Go to Settings > Secrets and variables > Actions > New repository
#      secret, name it TAURI_SIGNING_PRIVATE_KEY, paste the key contents in.
#   4. Open entropy-signing-password.txt, copy its single line of text.
#   5. Add a second secret named TAURI_SIGNING_PRIVATE_KEY_PASSWORD and
#      paste that password in as the value (must match exactly - no extra
#      spaces or newlines).
#   6. Copy the public key printed in this run's summary into
#      src-tauri/tauri.conf.json's plugins.updater.pubkey field, replacing
#      the placeholder value there.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keypair
        run: |
          PASSWORD=$(openssl rand -base64 24)
          echo "::add-mask::$PASSWORD"
          printf '%s' "$PASSWORD" > entropy-signing-password.txt
          npx --yes @tauri-apps/cli@latest signer generate --ci -p "$PASSWORD" -w ./entropy-signing.key -f
          echo "## Public key (safe to share - paste into tauri.conf.json)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ./entropy-signing.key.pub >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload private key as artifact (never logged, never committed)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key
          path: entropy-signing.key
          retention-days: 7

      - name: Upload key password as artifact (never logged, never committed)
        uses: actions/upload-artifact@v4
        with:
          name: signing-key-password
          path: entropy-signing-password.txt
          retention-days: 7
