name: Squad overview script runner

on:
  push:
    branches:
      - feature/squad-overview-build-swap-attribution

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/squad-overview-build-swap-attribution
          fetch-depth: 0
      - name: Apply edit
        run: python scripts/apply-squad-overview-sort.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-squad-overview-sort.py .github/workflows/squad-overview-script-runner.yml
          git add src/views/SquadStatsView.tsx
          git diff --cached --check
          git commit -m "Preserve Squad Stats roster sorting"
          git push origin HEAD:feature/squad-overview-build-swap-attribution
