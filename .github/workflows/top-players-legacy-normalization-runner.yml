name: Top Players legacy normalization runner

on:
  push:
    branches:
      - feature/top-players-legacy-normalization

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/top-players-legacy-normalization
          fetch-depth: 0
      - name: Apply edit
        run: python scripts/apply-top-players-legacy-normalization.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-top-players-legacy-normalization.py .github/workflows/top-players-legacy-normalization-runner.yml
          git add src/views/TopPlayersView.tsx
          git diff --cached --check
          git commit -m "Normalize legacy Top Players rows"
          git push origin HEAD:feature/top-players-legacy-normalization
