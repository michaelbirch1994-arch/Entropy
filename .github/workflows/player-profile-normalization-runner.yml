name: Player profile normalization runner

on:
  push:
    branches:
      - feature/player-profile-legacy-normalization

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/player-profile-legacy-normalization
          fetch-depth: 0
      - name: Apply edit
        run: python scripts/apply-player-profile-normalization.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-player-profile-normalization.py .github/workflows/player-profile-normalization-runner.yml
          git add src/lib/playerProfileStore.ts
          git diff --cached --check
          git commit -m "Normalize legacy player profile ingestion"
          git push origin HEAD:feature/player-profile-legacy-normalization
