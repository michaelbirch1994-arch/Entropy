name: Defensive legacy normalization script runner

on:
  push:
    branches:
      - feature/defensive-legacy-normalization

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/defensive-legacy-normalization
          fetch-depth: 0

      - name: Apply edit
        run: python scripts/apply-defensive-legacy-normalization.py

      - name: Commit result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/defensive-normalization-script-runner.yml scripts/apply-defensive-legacy-normalization.py
          git add src/views/DefensiveView.tsx
          git diff --cached --check
          git commit -m "Normalize legacy Defensive Stats rows"
          git push origin HEAD:feature/defensive-legacy-normalization
