[package]
name = "entropy"
version = "0.2.23"
description = "GW2 WvW combat analytics desktop app"
edition = "2021"




[build-dependencies]
tauri-build = { version = "2", features = [] }




[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"