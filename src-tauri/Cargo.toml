[package]
name = "entropy"
version = "0.1.0"
description = "GW2 WvW combat analytics desktop app"
edition = "2021"

[lib]
name = "entropy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
